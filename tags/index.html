<h1>Posts by Tags</h1>
<ul>
  {% for tag, posts in site.tags %}
  <li>
    <h2>{{ tag }}</h2>
    <ul>
      {% for post in posts %}
      <li>
        <a href="{{ post.url }}">{{ post.title }}</a>
        <p>{{ post.excerpt | strip_html | truncatewords: 20 }}</p>
      </li>
      {% endfor %}
    </ul>
  </li>
  {% endfor %}
</ul>
