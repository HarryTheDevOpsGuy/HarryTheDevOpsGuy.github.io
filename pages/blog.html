---
layout: base
title: Blog
permalink: /blog/
---

<section class="py-5">
    <div class="container">
      <div class="row">
        <div class="col-12 text-center mb-4">
          <h2 class="section-title">Posts</h2>
          <p class="lead">Explore All Posts.</p>
        </div>
      </div>
      <div class="row">

        <!-- Experience Card 1 -->
        {% for post in site.posts %}
        <div class="col-lg-4 col-md-6 mb-4">
          <div class="card ">
            <img src="/assets/img/logo.png" class="card-img-top" alt="Post 1">
            <div class="card-body">
              <h5 class="card-title">{{ post.title }}</h5>
              <h6 class="card-subtitle mb-2">Paytm</h6>
              <p class="card-text">{{ post.description }}</p>
              <a href="{{ post.url | relative_url }}" class="btn btn-light">Read More</a>
              <ul class="list-inline">
                <li class="list-inline-item"><strong>Published on:</strong> {{ post.date | date: "%B %d, %Y" }}</li>
                <li class="list-inline-item"><strong>Location:</strong> Noida</li>
              </ul>
            </div>
          </div>
        </div>
        {% endfor %}
        

      </div>
    </div>
  </section>
