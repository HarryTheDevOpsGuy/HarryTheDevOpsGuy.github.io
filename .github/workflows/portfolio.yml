# Simple workflow for deploying static content to GitHub Pages
name: CV -> HTDG-Portfolio

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["v7"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      cv_branch:
        description: 'CV-Branch'
        default: 'ai'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  build:
    env: 
     CV_BRANCH: ${{ github.event.inputs.cv_branch }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: CLONE REPOSITORIES ${{ env.CV_BRANCH }}
        run: |
          git clone -b ${CV_BRANCH} git@github.com:HarryTheDevOpsGuy/cv.git ${GITHUB_WORKSPACE}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            vendor/bundle
          key: ${{ runner.os }}-deps-${{ hashFiles('**/package-lock.json', '**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        run: |
          make setup

      - name: npm and jekyll build
        run: make build
        env:
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
      
