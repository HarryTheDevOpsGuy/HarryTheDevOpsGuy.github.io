---
layout: default
---

<!-- Print Styles -->
<style>
  @media print {
    @page {
      size: A4;
      margin: 0.5in;
    }
    body {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    header[role="banner"],
    footer[role="contentinfo"] {
      display: none !important;
    }
    .resume-container {
      padding: 0 !important;
      margin: 0 !important;
      max-width: 100% !important;
    }
    * {
      break-inside: auto !important;
    }
    a[href]:after {
      content: "" !important;
    }
  }
</style>

<!-- Download Button (Visible on screen only) -->
<div class="container mx-auto px-4 pt-4 print:hidden">
  <div class="flex justify-end">
    <button onclick="window.print()" class="px-4 py-2 bg-blue-600 text-white text-sm rounded-sm shadow-sm hover:bg-blue-700">🖨️ Print / Save as PDF</button>
  </div>
</div>

<div class="resume-container container mx-auto px-4 py-8">
  <!-- resume content remains unchanged -->
  {{ content }}
</div>
