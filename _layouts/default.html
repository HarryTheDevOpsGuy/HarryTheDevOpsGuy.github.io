<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="/assets/css/tailwind.css">
  {% seo %}
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-br from-primary-50 via-white to-purple-50 dark:from-gray-900 dark:via-gray-800 dark:to-primary-900 animate-gradient-slow">
  <header class="bg-white/95 dark:bg-gray-800/95 shadow-lg sticky top-0 z-50 backdrop-blur-sm border-b border-gray-200/50 dark:border-gray-700/30">
    <nav class="container mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="text-xl font-bold bg-gradient-to-r from-primary-600 to-purple-600 bg-clip-text text-transparent hover:scale-105 transition-transform duration-300">{{ site.title }}</a>
      <div class="hidden md:flex space-x-5">
        <a href="/portfolio" class="nav-link text-sm hover:text-primary-600 dark:hover:text-primary-400">Portfolio</a>
        <a href="/blog" class="nav-link text-sm hover:text-primary-600 dark:hover:text-primary-400">Blog</a>
        <a href="/courses" class="nav-link text-sm hover:text-primary-600 dark:hover:text-primary-400">Courses</a>
        <a href="/docs" class="nav-link text-sm hover:text-primary-600 dark:hover:text-primary-400">Docs</a>
        <a href="/garden" class="nav-link text-sm hover:text-primary-600 dark:hover:text-primary-400">Garden</a>
      </div>
      <button class="md:hidden p-2 rounded-lg bg-gray-50 dark:bg-gray-700/50 hover:bg-primary-50 dark:hover:bg-primary-900/30 transition-all duration-200" aria-label="Menu">
        <svg class="w-6 h-6 text-gray-600 dark:text-gray-300 group-hover:text-primary-500 dark:group-hover:text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </nav>
    <!-- Mobile menu -->
    <div class="md:hidden hidden bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm border-t border-gray-200/50 dark:border-gray-700/30">
      <div class="px-4 py-3 space-y-3">
        <a href="/portfolio" class="nav-link block hover:text-primary-600 dark:hover:text-primary-400">Portfolio</a>
        <a href="/blog" class="nav-link block hover:text-primary-600 dark:hover:text-primary-400">Blog</a>
        <a href="/courses" class="nav-link block hover:text-primary-600 dark:hover:text-primary-400">Courses</a>
        <a href="/docs" class="nav-link block hover:text-primary-600 dark:hover:text-primary-400">Docs</a>
        <a href="/garden" class="nav-link block hover:text-primary-600 dark:hover:text-primary-400">Garden</a>
      </div>
    </div>
  </header>

  <main class="flex-grow px-4 py-8 md:py-12">
    {{ content }}
  </main>

  <footer class="bg-white/95 dark:bg-gray-800/95 shadow-lg border-t border-gray-200/50 dark:border-gray-700/30 backdrop-blur-sm">
    <div class="container mx-auto px-4 py-8">
      <div class="text-center text-gray-600 dark:text-gray-400">
        <p class="animate-fade-in">&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script>
    // Mobile menu toggle
    document.querySelector('button[aria-label="Menu"]').addEventListener('click', function() {
      document.querySelector('.md\\:hidden:not(button)').classList.toggle('hidden');
    });
  </script>
</body>
</html>
