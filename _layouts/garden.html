---
layout: default
---

<div class="container mx-auto px-4 py-8 md:py-12">
  <article class="prose dark:prose-invert lg:prose-lg max-w-none bg-white/95 dark:bg-gray-800/95 p-8 rounded-xl shadow-lg backdrop-blur-sm border border-gray-200/50 dark:border-gray-700/30 hover:border-primary-500/30 dark:hover:border-primary-400/30 transition-all duration-300 hover:shadow-primary-500/10 dark:hover:shadow-primary-400/10">
    <h1 class="text-4xl font-extrabold bg-gradient-to-r from-primary-600 to-purple-600 bg-clip-text text-transparent animate-gradient mb-8">{{ page.title }}</h1>
    
    {% if page.status %}
    <div class="mb-4">
      <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-primary-100 dark:bg-primary-900/30 text-primary-600 dark:text-primary-400">
        {{ page.status }}
      </span>
    </div>
    {% endif %}

    {% if page.tags %}
    <div class="mb-6 flex flex-wrap gap-2">
      {% for tag in page.tags %}
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200">
        {{ tag }}
      </span>
      {% endfor %}
    </div>
    {% endif %}

    {{ content }}
  </article>
</div>
