professional_summary: |
  11+ years of experience in DevOps engineering, specializing in cloud automation, CI/CD pipelines, and infrastructure as code (IaC). Proficient in tools like Terraform, Ansible, Packer, Kubernetes, Docker, Jenkins, and monitoring stacks (Prometheus, ELK). Skilled in designing scalable, secure, and highly available systems. Strong collaboration skills with a focus on bridging the gap between development and operations.

technical_skills:
  - category: "Infrastructure as Code (IaC)"
    description: "Provision, deploy, and manage entire infrastructure as code with Terraform, Ansible, Jenkins, Groovy and shell script."
  - category: "CI/CD Automation"
    description: "Proficient in creating and maintaining automated CI/CD pipelines using Jenkins, ArgoCD, and GitHub Actions for Java, Nodejs, php, python etc applications."
  - category: "Cloud Infrastructure Management"
    description: "Expertise in managing AWS services like EC2, S3, RDS, VPC, IAM, CloudWatch, Secrets, Route 53, Lambda, and more."
  - category: "Configuration Management"
    description: "Strong experience with Ansible, Terraform, and Packer for automating system configuration, provisioning, and infrastructure management."
  - category: "Containerization & Orchestration"
    description: "Hands-on experience with Docker, Kubernetes, Helm, Karpenter and EKS for containerized application deployment and management."
  - category: "Security & Compliance"
    description: "Knowledge in security best practices, including CIS Linux hardening, vulnerability patching and managing sensitive data with Vault."
  - category: "Automation & Scripting"
    description: "Proficiency in scripting to develop custom tool to automate manual and repeated task."
  - category: "Monitoring & Logging"
    description: "Experienced in setting up and managing monitoring/logging systems using Prometheus, Grafana, ELK Stack, Telegraf, Prometheus Exporters and CloudWatch."
  - category: "Web & Application Servers"
    description: "Hands-on experience with Nginx, Apache, Tomcat, OpenResty and Springboot."

