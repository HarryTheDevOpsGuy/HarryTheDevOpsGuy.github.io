title: Digital Garden & Portfolio
description: A modern portfolio with blogs, docs, courses, and digital garden
baseurl: ""
url: "https://harrythedevopsguy.github.io"

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Collections
collections:
  portfolio:
    output: true
    permalink: /portfolio/:path/
  courses:
    output: true
    permalink: /courses/:path/
  docs:
    output: true
    permalink: /docs/:path/
  garden:
    output: true
    permalink: /garden/:path/

# Pagination
paginate: 6
paginate_path: "/blog/page:num/"

# Exclude files from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - vendor