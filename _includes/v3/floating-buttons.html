<div class="floating-buttons">
    <div class="btn-group">
        <button class="btn theme-toggle-btn" onclick="changeToRandomColor()"><i class="fas fa-palette"></i></button>
        <div class="dropdown-menu theme-selector">
            <button style="background-color: #bb86fc;" onclick="changeThemeColor('#bb86fc')"></button>
            <button style="background-color: #03dac6;" onclick="changeThemeColor('#03dac6')"></button>
            <button style="background-color: #cf6679;" onclick="changeThemeColor('#cf6679')"></button>
            <button style="background-color: #ffb74d;" onclick="changeThemeColor('#ffb74d')"></button>
            <button style="background-color: #64b5f6;" onclick="changeThemeColor('#64b5f6')"></button>
            <button style="background-color: #757575;" onclick="changeThemeColor('#757575')"></button>
            <button style="background-color: #6c757d;" onclick="changeToRandomColor()"></button>
        </div>
    </div>
    <div class="btn-group">
        <button class="btn resume-toggle-btn">
            <i class="fas fa-cog"></i>
        </button>
        <div class="dropdown-menu resume-manager">
            <button onclick="window.print()"><i class="fas fa-print"></i></button>
            <button onclick="alert('Save functionality not implemented')"><i class="fas fa-save"></i></button>
            <button onclick="alert('Edit functionality not implemented')"><i class="fas fa-edit"></i></button>
            <button onclick="alert('Share functionality not implemented')"><i class="fas fa-share-alt"></i></button>
            <button onclick="alert('Delete functionality not implemented')"><i class="fas fa-trash"></i></button>
        </div>
    </div>
    
    <div class="btn-group">
        <button class="btn font-style-toggle-btn">
            <i class="fas fa-font"></i>
        </button>
        <div class="dropdown-menu font-style-selector">
            <button onclick="changeFontStyle()"><i class="fas fa-random"></i></button>
        </div>
    </div>
    <div class="btn-group">
        <button class="btn font-size-toggle-btn">
            <i class="fas fa-text-height"></i>
        </button>
        <div class="dropdown-menu font-size-selector">
            <button onclick="changeFontSize()"><i class="fas fa-random"></i></button>
        </div>
    </div>
    <div class="btn-group">
        <button class="btn theme-switch-btn" onclick="toggleTheme()">
            <i class="fas fa-adjust"></i>
        </button>
    </div>
</div>
